<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestier</title>
<meta name="description" content="">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="hero">
  <div class="container hero-body">
    <h1 data-i18n="hero.title"></h1>
    <p class="lead" data-i18n="hero.text"></p>
    <a class="btn" href="rooms.html" data-i18n="cta.rooms"></a>
  </div>
  <form class="booking" action="rooms.html">
    <div class="field"><label for="in" data-i18n="book.in"></label><input id="in" name="checkin" type="date"></div>
    <div class="field"><label for="out" data-i18n="book.out"></label><input id="out" name="checkout" type="date"></div>
    <div class="field"><label for="guests" data-i18n="book.guests"></label>
      <select id="guests" name="guests"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
    <button class="btn" type="submit" data-i18n="book.search"></button>
  </form>
</section>

<section class="section">
  <div class="container split">
    <div><h2 data-i18n="about.title"></h2><p data-i18n="common.placeholder"></p><p data-i18n="common.placeholder"></p></div>
    <img class="ph ph--tall" src="assets/images/center.jpg" alt="รูปพื้นที่ส่วนกลาง">
  </div>
</section>

<section class="section section--mist">
  <div class="container">
    <div class="section-head"><h2 data-i18n="rooms.title"></h2></div>
    <div class="grid grid--3" data-rooms data-limit="3"></div>
  </div>
</section>

<section class="section section--dark">
  <div class="container">
    <div class="section-head"><h2 data-i18n="fac.title"></h2></div>
    <ul class="fac-list">
      <li><h3 data-i18n="fac.spa"></h3><p data-i18n="common.placeholder"></p></li>
      <li><h3 data-i18n="fac.dining"></h3><p data-i18n="common.placeholder"></p></li>
      <li><h3 data-i18n="fac.pool"></h3><p data-i18n="common.placeholder"></p></li>
    </ul>
    <p style="margin:3rem 0 0"><a class="btn btn--line" href="facilities.html" data-i18n="common.viewAll"></a></p>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="js/navigation.js"></script>
<script src="js/language.js"></script>
<script src="js/rooms.js"></script>
<script src="js/main.js"></script>
</body>
</html>
