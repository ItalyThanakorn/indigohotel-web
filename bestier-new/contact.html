<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Bestier</title>
<meta name="description" content="">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-hero"><div class="container"><h1 data-i18n="contact.title"></h1></div></section>
<section class="section">
  <div class="container split" style="align-items:start">
    <ul class="contact-info">
      <li>000 ถนน… เมือง… จังหวัด…</li>
      <li><a href="tel:+66000000000">+66 00 000 0000</a></li>
      <li><a href="mailto:info@your-hotel.com">info@your-hotel.com</a></li>
      <li><!-- ฝัง Google Map ที่นี่ --></li>
    </ul>
    <!-- action="#" ยังไม่ส่งไปไหน: ผูกกับ backend / Formspree / อีเมล ตามที่ใช้ -->
    <form class="form" action="#" method="post">
      <div class="field"><label for="name" data-i18n="contact.name"></label><input id="name" name="name" required></div>
      <div class="field"><label for="email" data-i18n="contact.email"></label><input id="email" name="email" type="email" required></div>
      <div class="field"><label for="msg" data-i18n="contact.message"></label><textarea id="msg" name="message" rows="5" required></textarea></div>
      <button class="btn" type="submit" data-i18n="contact.send"></button>
    </form>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="js/navigation.js"></script>
<script src="js/language.js"></script>
<script src="js/main.js"></script>
</body>
</html>
