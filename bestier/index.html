<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestier</title>
<meta name="description" content="โรงแรม Bestier หาดใหญ่ ใกล้ ญ.ว. ใจกลางเมือง ห้องพักสะอาด ทันสมัย จองตรงทาง LINE รับโปรโมชันพิเศษ">
<meta name="theme-color" content="#4B2E2B">
<link rel="icon" href="assets/images/bestier-mark.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="common.skip"></a>
<header id="site-header"></header>
<main id="main">
<section class="hero">
  <div class="container hero-body">
    <h1 data-i18n="hero.title"></h1>
    <p class="lead" data-i18n="hero.text"></p>
    <div class="actions">
      <a class="btn btn--chat" data-line-cta target="_blank" rel="noopener" data-i18n="cta.book"></a>
      <a class="btn btn--line" href="rooms.html" data-i18n="cta.rooms"></a>
    </div>
  </div>
  <form class="booking" data-line-form>
    <div class="field"><label for="in" data-i18n="book.in"></label><input id="in" name="checkin" type="date" required></div>
    <div class="field"><label for="out" data-i18n="book.out"></label><input id="out" name="checkout" type="date" required></div>
    <div class="field"><label for="rooms" data-i18n="book.rooms"></label>
      <select id="rooms" name="rooms"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div class="field"><label for="contact" data-i18n="book.contact"></label><input id="contact" name="contact" autocomplete="tel"></div>
    <button class="btn btn--chat" type="submit" data-i18n="book.search"></button>
  </form>
</section>

<div class="container">
  <ul class="highlights">
    <li data-i18n="hl.1"></li><li data-i18n="hl.2"></li><li data-i18n="hl.3"></li><li data-i18n="hl.4"></li>
  </ul>
</div>

<section class="section">
  <div class="container split">
    <div><h2 data-i18n="about.title"></h2><p data-i18n="about.p1"></p><p data-i18n="about.p2"></p></div>
    <img class="ph ph--tall" src="assets/images/center.jpg" alt="" data-i18n-alt="about.alt" loading="lazy">
  </div>
</section>

<section class="section section--mist" id="rooms">
  <div class="container">
    <div class="section-head"><h2 data-i18n="rooms.title"></h2><p class="promo" data-render="promo" hidden></p></div>
    <div class="grid grid--3" data-rooms></div>
    <p class="ota" data-render="ota" hidden></p>
  </div>
</section>

<section class="section" id="location">
  <div class="container split">
    <div>
      <h2 data-i18n="loc.title"></h2>
      <p data-i18n="loc.text"></p>
      <address data-render="address"></address>
      <ul class="tick-list" data-render="nearby"></ul>
      <a class="btn btn--line" data-map-link target="_blank" rel="noopener" data-i18n="loc.open"></a>
    </div>
    <div data-render="map"></div>
  </div>
</section>

<section class="section section--mist">
  <div class="container">
    <div class="section-head"><h2 data-i18n="fac.title"></h2></div>
    <ul class="fac-list" data-render="facilities" data-limit="4"></ul>
    <p style="margin:3rem 0 0"><a class="btn btn--line" href="facilities.html" data-i18n="fac.more"></a></p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head"><h2 data-i18n="gal.title"></h2></div>
    <div data-render="gallery"></div>
  </div>
</section>

<section class="section section--mist">
  <div class="container">
    <div class="section-head"><h2 data-i18n="br.title"></h2><p data-i18n="br.text"></p></div>
    <div class="branches" data-render="branches"></div>
  </div>
</section>

<section class="section section--dark">
  <div class="container cta">
    <h2 data-i18n="cta.title"></h2>
    <p data-i18n="cta.text"></p>
    <a class="btn btn--chat" data-line-cta target="_blank" rel="noopener" data-i18n="cta.book"></a>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/language.js"></script>
<script src="js/navigation.js"></script>
<script src="js/rooms.js"></script>
<script src="js/main.js"></script>
</body>
</html>
