<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="นาฬิกาข้อมือสไตล์ Rolex แสดงเวลา 16:45">
<defs>
 <linearGradient id="strap" x2="1" y2="1"><stop stop-color="#174a38"/><stop offset=".5" stop-color="#287153"/><stop offset="1" stop-color="#103d2e"/></linearGradient>
 <linearGradient id="gold" x2=".8" y2="1"><stop stop-color="#fff0a7"/><stop offset=".25" stop-color="#c89837"/><stop offset=".52" stop-color="#f6dc82"/><stop offset=".8" stop-color="#a77721"/><stop offset="1" stop-color="#f5d979"/></linearGradient>
 <radialGradient id="dial" cx=".35" cy=".3"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8ece7"/></radialGradient>
 <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#12251d" flood-opacity=".25"/></filter>
</defs>
<rect width="900" height="900" rx="60" fill="#f2f0e9"/>
<!-- leather bracelet -->
<path d="M320 35 Q450 5 580 35 L625 275 L275 275Z" fill="url(#strap)" stroke="#123a2d" stroke-width="8"/>
<path d="M280 625 L620 625 L580 865 Q450 895 320 865Z" fill="url(#strap)" stroke="#123a2d" stroke-width="8"/>
<g fill="none" stroke="#bb9a54" stroke-width="3" opacity=".85"><path d="M330 45L300 270M570 45L600 270M300 630L330 855M600 630L570 855"/></g>
<!-- case -->
<g filter="url(#shadow)">
 <circle cx="450" cy="450" r="245" fill="#26352e"/>
 <circle cx="450" cy="450" r="232" fill="url(#gold)" stroke="#99702c" stroke-width="5"/>
 <circle cx="450" cy="450" r="207" fill="#173d31" stroke="#e8d18a" stroke-width="6"/>
 <circle cx="450" cy="450" r="190" fill="url(#dial)" stroke="#263c32" stroke-width="5"/>
</g>
<!-- crown -->
<path d="M681 418h35v64h-35l-12-12v-40z" fill="url(#gold)" stroke="#8d6829" stroke-width="5"/><path d="M691 425v50m11-50v50m11-50v50" stroke="#8d6829" stroke-width="3"/>
<!-- markers -->
<g fill="#ad832e" stroke="#f4df9b" stroke-width="1">
 <rect x="444" y="274" width="12" height="22" rx="4"/><rect x="444" y="604" width="12" height="22" rx="4"/>
 <rect x="274" y="444" width="22" height="12" rx="4"/><rect x="604" y="444" width="22" height="12" rx="4"/>
 <circle cx="535" cy="298" r="5"/><circle cx="583" cy="345" r="5"/><circle cx="602" cy="535" r="5"/><circle cx="555" cy="583" r="5"/>
 <circle cx="365" cy="583" r="5"/><circle cx="318" cy="535" r="5"/><circle cx="318" cy="365" r="5"/><circle cx="365" cy="318" r="5"/>
</g>
<!-- brand crown and wordmark -->
<g fill="none" stroke="#ae842d" stroke-width="3" stroke-linejoin="round"><path d="M432 320l-12-13 10-9 10 12 10-12 10 9-12 13z"/><path d="M420 307l-5-10 13 3m32 7 5-10-13 3"/></g>
<text x="450" y="344" text-anchor="middle" font-family="Georgia,serif" font-size="21" letter-spacing="2" fill="#1a392d">ROLEX</text>
<text x="450" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#45554b">OYSTER PERPETUAL</text>
<!-- hands: minute at 9, hour at 4:45 (between 4 and 5) -->
<path d="M450 450 L328 450" stroke="#172d25" stroke-width="10" stroke-linecap="round"/>
<path d="M450 450 L485 505" stroke="#172d25" stroke-width="15" stroke-linecap="round"/>
<path d="M450 450 L327 450" stroke="#d4b75f" stroke-width="2" stroke-linecap="round"/>
<circle cx="450" cy="450" r="13" fill="url(#gold)" stroke="#173d31" stroke-width="4"/>
<!-- date window -->
<rect x="563" y="432" width="42" height="36" rx="4" fill="#fff" stroke="#aa812e" stroke-width="3"/><text x="584" y="457" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172d25">25</text>
<text x="450" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#44584b">SWISS MADE</text>
<!-- soft highlight -->
<path d="M304 380a155 155 0 0 1 116-112" fill="none" stroke="#fff" stroke-width="5" opacity=".45" stroke-linecap="round"/>
